name: Release

# Builds the release APK on tag push (or manually), uploads the artifact,
# and — on tag push — creates/updates the GitHub Release with the APK.
# Failures publish a "Release diagnostics" check-run with the tail of the
# error, readable via the API.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK (stable)
        run: |
          set -o pipefail
          tee diag.txt <<< "Downloading Flutter SDK..."
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/flutter.tar.xz \
            https://storage.googleapis.com/flutter_infra/releases/stable/linux/flutter_linux_stable.tar.xz 2>&1 | tee -a diag.txt || true
          if [ ! -s /tmp/flutter.tar.xz ]; then
            echo "FLUTTER SDK DOWNLOAD FAILED (curl error above in diag.txt)" >> diag.txt
            cat diag.txt
            exit 1
          fi
          sudo tar -xJf /tmp/flutter.tar.xz -C /opt/flutter --strip-components=1 2>&1 | tee -a diag.txt
          if [ ! -d /opt/flutter/bin ]; then
            echo "FLUTTER SDK EXTRACT FAILED (see diag.txt)" >> diag.txt
            cat diag.txt
            exit 1
          fi
          sudo chown -R $USER /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          git config --global --add safe.directory /opt/flutter
          /opt/flutter/bin/flutter --version 2>&1 | tee -a diag.txt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" 2>&1 | tee build.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 90

      - name: Diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { [ -f diag.txt ] && cat diag.txt; [ -f build.log ] && tail -n 100 build.log; } > diag.final || true
          if [ ! -s diag.final ]; then echo "(see the failed step in the Actions log)" > diag.final; fi
          tail -n 60 diag.final | cut -c1-170 > diag.txt || true
          jq -n --rawfile t diag.txt --arg sha "${{ github.sha }}" '{name:"Release diagnostics",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Release diagnostics",summary:"Tail of the failed build.",text:$t}}' > diag.json
          gh api -X POST "repos/${{ github.repository }}/check-runs" --input diag.json > /dev/null && echo "diagnostics recorded" || echo "diagnostics upload failed"

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/') && !failure()
        run: |
          gh release create "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Ripple ${{ github.ref_name }}" \
            --generate-notes --latest || \
          gh release upload "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-release.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
