name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Also create/update the GitHub Release with the built APK'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix DNS
        run: |
          echo "108.157.235.202 pub.dev" | sudo tee -a /etc/hosts
          echo "108.157.235.202 storage.googleapis.com" | sudo tee -a /etc/hosts

      - name: Install Flutter SDK (stable)
        run: |
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/flutter.tar.xz \
            https://storage.googleapis.com/flutter_infra/releases/stable/linux/flutter_linux_stable.tar.xz
          sudo tar -xJf /tmp/flutter.tar.xz -C /opt/flutter --strip-components=1
          sudo chown -R $USER /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          git config --global --add safe.directory /opt/flutter
          /opt/flutter/bin/flutter --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "Ripple ${{ github.ref_name }}" \
            --generate-notes --latest || \
          gh release upload "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
