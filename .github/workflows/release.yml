name: Release

# Builds the release APK on tag push (or manually), uploads the artifact,
# and — on tag push — creates/updates the GitHub Release with the APK.
# Failures publish a "Release diagnostics" check-run with the tail of the
# error, readable via the API.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APK to (e.g. v1.0.0)
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK (stable)
        run: |
          set -o pipefail
          tee diag.txt <<< "Downloading Flutter SDK (resolving from releases_linux.json)..."
          MANIFEST_URL="https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          MANIFEST_BASE="https://storage.googleapis.com/flutter_infra_release/releases"
          JSON=$(curl -fsSL --connect-timeout 15 --retry 5 "$MANIFEST_URL" 2>&1) || { echo "MANIFEST DOWNLOAD FAILED" | tee diag.txt; cat diag.txt; exit 1; }
          echo "$JSON" > /tmp/manifest.json
          URL=$(echo "$JSON" | jq -r '[.releases[] | select(.channel == "stable") | select(.dart_sdk_arch == "x64" or (.dart_sdk_arch == null))][0].archive' 2>&1) || { echo "JQ PARSE FAILED" | tee -a diag.txt; exit 1; }
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "NO STABLE x64 ARCHIVE FOUND IN MANIFEST" | tee -a diag.txt
            exit 1
          fi
          echo "Resolved stable archive: $URL" | tee -a diag.txt
          FULL_URL="$MANIFEST_BASE/$URL"
          curl --connect-timeout 15 --retry 5 -fSL "$FULL_URL" -o /tmp/flutter.tar.xz > diag.txt 2>&1 || true
          cat diag.txt
          if [ ! -s /tmp/flutter.tar.xz ]; then
            echo "FLUTTER SDK DOWNLOAD FAILED" | tee -a diag.txt
            exit 1
          fi
          sudo mkdir -p /opt/flutter
          sudo tar -xJf /tmp/flutter.tar.xz -C /opt/flutter --strip-components=1 >> diag.txt 2>&1 || { echo "FLUTTER SDK EXTRACT FAILED" | tee -a diag.txt; exit 1; }
          if [ ! -d /opt/flutter/bin ]; then
            echo "FLUTTER SDK EXTRACT FAILED (no bin dir)" | tee -a diag.txt
            exit 1
          fi
          sudo chown -R $USER /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          git config --global --add safe.directory /opt/flutter
          /opt/flutter/bin/flutter --version 2>&1 | tee -a diag.txt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Supabase configuration (presence only)
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is missing — the app cannot log in without it."
            echo "::error::Add the secret at: repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is missing — the app cannot log in without it."
            echo "::error::Add the secret at: repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Supabase configuration present (values not printed)."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK (release)
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" 2>&1 | tee build.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 90

      - name: Diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { [ -f diag.txt ] && cat diag.txt; [ -f build.log ] && tail -n 100 build.log; } > diag.final || true
          if [ ! -s diag.final ]; then echo "(see the failed step in the Actions log)" > diag.final; fi
          tail -n 100 diag.final | cut -c1-400 > diag.txt || true
          jq -n --rawfile t diag.txt --arg sha "${{ github.sha }}" '{name:"Release diagnostics",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Release diagnostics",summary:"Tail of the failed build.",text:$t}}' > diag.json
          gh api -X POST "repos/${{ github.repository }}/check-runs" --input diag.json > /dev/null && echo "diagnostics recorded" || echo "diagnostics upload failed"

      - name: Upload APK (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && !failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release upload "$RELEASE_TAG" build/app/outputs/flutter-apk/app-release.apk --clobber --repo ${{ github.repository }}
          else
            echo "No tag provided — skipping release upload"
          fi

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/') && !failure()
        run: |
          gh release create "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Ripple ${{ github.ref_name }}" \
            --generate-notes --latest || \
          gh release upload "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-release.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
