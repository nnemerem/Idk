name: Build iOS

on:
  push:
    branches: [main, arena/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 45
    # Only run on tags or manual dispatch to save macOS minutes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Verify secrets exist
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets must be set in GitHub repo settings!"
            exit 1
          fi
          echo "✅ Secrets verified"

      - name: Configure Supabase constants (BEFORE pub get)
        run: |
          cat > lib/config/supabase_config.dart << 'EOF'
          // Generated by GitHub Actions - DO NOT EDIT MANUALLY
          class SupabaseConfig {
            static const String supabaseUrl = '${{ secrets.SUPABASE_URL }}';
            static const String supabaseAnonKey = '${{ secrets.SUPABASE_ANON_KEY }}';
          }
          EOF
          echo "✅ Generated supabase_config.dart"
          cat lib/config/supabase_config.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (release)
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ripple-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/ios/ipa/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false