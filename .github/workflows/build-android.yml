name: Build Android

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify secrets exist
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets must be set in GitHub repo settings!"
            exit 1
          fi
          echo "✅ Secrets verified"

      - name: Configure Supabase constants (BEFORE pub get)
        run: |
          cat > lib/config/supabase_config.dart << 'EOF'
          // Generated by GitHub Actions - DO NOT EDIT MANUALLY
          class SupabaseConfig {
            static const String supabaseUrl = '${{ secrets.SUPABASE_URL }}';
            static const String supabaseAnonKey = '${{ secrets.SUPABASE_ANON_KEY }}';
          }
          EOF
          echo "✅ Generated supabase_config.dart"
          cat lib/config/supabase_config.dart

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Test network connectivity
        run: |
          echo "Testing pub.dev connectivity..."
          curl -s -o /dev/null -w "%{http_code}" https://pub.dev || echo "curl failed"
          ping -c 2 pub.dev || echo "ping failed"

      - name: Install dependencies (with output capture)
        continue-on-error: true
        run: |
          flutter pub get 2>&1 | tee pub_get_output.txt
          PUB_EXIT=${PIPESTATUS[0]}
          echo "EXIT_CODE=$PUB_EXIT" >> pub_get_output.txt
          exit $PUB_EXIT
        shell: bash

      - name: Show pub get output (for debugging)
        if: always()
        run: |
          echo "=== PUB GET OUTPUT ==="
          cat pub_get_output.txt
          echo "=== END OUTPUT ==="
          EXIT_CODE=$(grep "EXIT_CODE=" pub_get_output.txt | tail -1 | cut -d= -f2)
          echo "Captured exit code: '$EXIT_CODE'"
          if [ "$EXIT_CODE" != "0" ] && [ -n "$EXIT_CODE" ]; then
            echo "::error::flutter pub get failed with exit code $EXIT_CODE"
            exit 1
          elif [ -z "$EXIT_CODE" ]; then
            echo "::error::Could not capture exit code from pub get output"
            exit 1
          fi

      - name: Upload pub get logs (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-get-logs
          path: pub_get_output.txt
          retention-days: 7

      - name: Verify Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK (debug)
        run: flutter build apk --debug
        if: github.event_name == 'pull_request'

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi
        if: github.event_name != 'pull_request'

      - name: Build App Bundle (release)
        run: flutter build appbundle --release
        if: github.event_name != 'pull_request'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: ripple-debug-apk
          path: build/app/outputs/flutter-apk/app-*-debug.apk
          retention-days: 7

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ripple-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ripple-app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false