name: Build Android

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.15.0
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify secrets exist
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets must be set!"
            exit 1
          fi
          echo "✅ Secrets verified"

      - name: Show Flutter version
        run: flutter --version

      - name: Show pubspec.yaml
        run: cat pubspec.yaml

      - name: Install dependencies
        run: flutter pub get --verbose

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripple-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30