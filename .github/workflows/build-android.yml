name: Build Android

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix DNS
        run: |
          echo "108.157.235.202 pub.dev" | sudo tee -a /etc/hosts
          echo "108.157.235.202 storage.googleapis.com" | sudo tee -a /etc/hosts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripple-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30