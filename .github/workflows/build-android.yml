name: Build Android

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Flutter manually
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          flutter --version

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify secrets exist
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets must be set!"
            exit 1
          fi
          echo "✅ Secrets verified"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Show pubspec.yaml
        run: cat pubspec.yaml

      - name: Test network connectivity
        run: |
          echo "Testing pub.dev..."
          curl -v https://pub.dev 2>&1 | head -20 || echo "curl failed"

      - name: Install dependencies
        run: flutter pub get --verbose

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ripple-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30