name: secret-check

# Temporary — verifies presence of the release secrets WITHOUT exposing their
# values. Posts a check-run with "set"/"unset" per secret.

on:
  workflow_dispatch:

permissions:
  checks: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: verify presence
        run: |
          set -e
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then URL_STATE="SET"; else URL_STATE="NOT SET"; fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then KEY_STATE="SET"; else KEY_STATE="NOT SET"; fi
          echo "SUPABASE_URL: $URL_STATE"
          echo "SUPABASE_ANON_KEY: $KEY_STATE"
          jq -n --arg sha "${{ github.sha }}" \
            --arg url "$URL_STATE" --arg key "$KEY_STATE" \
            '{name:"Secrets check",head_sha:$sha,status:"completed",conclusion:"success",output:{title:"Secrets check",summary:"Presence of release secrets (values are never printed).",text:("SUPABASE_URL: " + $url + "\nSUPABASE_ANON_KEY: " + $key)}}' > check.json
          gh api -X POST "repos/${{ github.repository }}/check-runs" --input check.json > /dev/null && echo "check recorded"
