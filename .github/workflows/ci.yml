name: CI

# Analyze the app on every push. Failures publish a "CI diagnostics"
# check-run with the tail of the error so the real reason is readable
# from the API even with limited runner access.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK (stable)
        run: |
          set -o pipefail
          tee diag.txt <<< "Downloading Flutter SDK (resolving from releases_linux.json)..."
          MANIFEST_URL="https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          MANIFEST_BASE="https://storage.googleapis.com/flutter_infra_release/releases"
          JSON=$(curl -fsSL --connect-timeout 15 --retry 5 "$MANIFEST_URL" 2>&1) || { echo "MANIFEST DOWNLOAD FAILED" | tee diag.txt; cat diag.txt; exit 1; }
          echo "$JSON" > /tmp/manifest.json
          URL=$(echo "$JSON" | jq -r '[.releases[] | select(.channel == "stable") | select(.dart_sdk_arch == "x64" or (.dart_sdk_arch == null))][0].archive' 2>&1) || { echo "JQ PARSE FAILED" | tee -a diag.txt; exit 1; }
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "NO STABLE x64 ARCHIVE FOUND IN MANIFEST" | tee -a diag.txt
            exit 1
          fi
          echo "Resolved stable archive: $URL" | tee -a diag.txt
          FULL_URL="$MANIFEST_BASE/$URL"
          curl --connect-timeout 15 --retry 5 -fSL "$FULL_URL" -o /tmp/flutter.tar.xz > diag.txt 2>&1 || true
          cat diag.txt
          if [ ! -s /tmp/flutter.tar.xz ]; then
            echo "FLUTTER SDK DOWNLOAD FAILED" | tee -a diag.txt
            exit 1
          fi
          sudo mkdir -p /opt/flutter
          sudo tar -xJf /tmp/flutter.tar.xz -C /opt/flutter --strip-components=1 >> diag.txt 2>&1 || { echo "FLUTTER SDK EXTRACT FAILED" | tee -a diag.txt; exit 1; }
          if [ ! -d /opt/flutter/bin ]; then
            echo "FLUTTER SDK EXTRACT FAILED (no bin dir)" | tee -a diag.txt
            exit 1
          fi
          sudo chown -R $USER /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          git config --global --add safe.directory /opt/flutter
          /opt/flutter/bin/flutter --version 2>&1 | tee -a diag.txt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a diag.txt

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee -a diag.txt

      - name: Publish diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s diag.txt ]; then echo "(see the failed step in the Actions log)" > diag.txt; fi
          tail -n 100 diag.txt | cut -c1-400 > diag.final || true
          cp diag.final diag.txt || true
          jq -n --rawfile t diag.txt --arg sha "${{ github.sha }}" '{name:"CI diagnostics",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"CI diagnostics",summary:"Tail of the failed step.",text:$t}}' > diag.json
          gh api -X POST "repos/${{ github.repository }}/check-runs" --input diag.json > /dev/null && echo "diagnostics recorded" || echo "diagnostics upload failed"
